<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Gastos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <h1>Control de Gastos</h1>
    <nav class="vistas" role="tablist" aria-label="Vista">
      <button role="tab" id="tab-asistente" aria-selected="true">Asistente</button>
      <button role="tab" id="tab-gerente" aria-selected="false">Gerente</button>
    </nav>
  </header>

  <main>
    <section class="controles">
      <label>Mes de vencimiento
        <input type="month" id="mes">
      </label>
      <label class="solo-asistente">Buscar
        <input type="search" id="busqueda" placeholder="Descripción o proveedor">
      </label>
      <label class="solo-asistente">Estado
        <select id="filtro-estado">
          <option value="">Todos</option>
          <option>Pendiente</option><option>Vencido</option><option>Pagado</option>
        </select>
      </label>
      <button type="button" id="limpiar" class="secundario solo-asistente">Quitar filtros</button>
      <button type="button" id="nuevo" class="primario solo-asistente">Registrar gasto</button>
    </section>

    <section id="resumen" class="resumen" aria-live="polite"></section>

    <p id="aviso" role="status" class="aviso" hidden></p>

    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Descripción</th><th>Proveedor / beneficiario</th><th>Categoría</th>
            <th class="num">Monto</th><th>Vence</th><th>Estado</th><th class="solo-asistente">Acciones</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <p id="vacio" class="vacio" hidden></p>
  </main>

  <dialog id="dlg-gasto">
    <form method="dialog" id="form-gasto" novalidate>
      <h2 id="dlg-gasto-titulo">Registrar gasto</h2>
      <input type="hidden" name="id">
      <label>Descripción *<input name="descripcion" required></label>
      <label>Proveedor o beneficiario<input name="proveedor"></label>
      <label>Categoría<input name="categoria" list="categorias" placeholder="Servicios, Proveedores, Préstamos…"></label>
      <datalist id="categorias"><option>Servicios</option><option>Proveedores</option><option>Préstamos</option><option>Impuestos</option><option>Otros</option></datalist>
      <div class="par">
        <label>Monto (S/) *<input name="monto" type="number" step="0.01" min="0.01" required></label>
        <label>Fecha de vencimiento *<input name="fecha_vencimiento" type="date" required></label>
      </div>
      <label>Observaciones<textarea name="observaciones" rows="2"></textarea></label>
      <p class="error" id="error-gasto" role="alert" hidden></p>
      <div class="acciones">
        <button type="button" class="secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="primario">Guardar gasto</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-pago">
    <form method="dialog" id="form-pago" novalidate>
      <h2>Registrar pago realizado</h2>
      <p id="pago-detalle"></p>
      <p class="nota">El sistema no realiza pagos: solo guarda que usted ya pagó por el medio habitual.</p>
      <input type="hidden" name="id">
      <label>Fecha en que se realizó el pago *<input name="fecha_pago" type="date" required></label>
      <p class="error" id="error-pago" role="alert" hidden></p>
      <div class="acciones">
        <button type="button" class="secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="primario">Guardar pago</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
